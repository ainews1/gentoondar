name: task_calendar_app
description: A cross-platform task management app with integrated calendar functionality
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  table_calendar: ^3.0.9
  intl: ^0.19.0
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true